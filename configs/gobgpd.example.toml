# Example only. Replace ASN/router-id and configure neighbors before live use.
# This file starts an isolated daemon with no BGP listener and no neighbors.
[global.config]
  as = 65000
  router-id = "192.0.2.254"
  port = -1

[global.apply-policy.config]
  default-import-policy = "reject-route"
  default-export-policy = "reject-route"

