<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AegisFlow 控制台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/rules.js" defer></script></head>
<body>
<header><h1>AegisFlow 控制台</h1><a href="#rulesSection">Community 規則</a><a id="grafana" target="_blank" rel="noopener">Grafana 詳細圖表 ↗</a></header>
<p id="message" role="alert" hidden></p>
<section><h2>流量觀察</h2>
<div class="fields"><label>時間範圍<select id="chartRange"><option value="now-5m">近 5 分鐘</option><option value="now-15m" selected>近 15 分鐘</option><option value="now-1h">近 1 小時</option><option value="now-6h">近 6 小時</option><option value="now-24h">近 24 小時</option></select></label></div>
<div id="grafanaOverview" class="grafana-charts"></div>
<div class="fields"><label>詳細資料方向<select id="directionSelect"><option value="IN">IN</option><option value="OUT">OUT</option></select></label></div>

<div id="interfaceDetails"><h3 id="interfaceHeading"></h3>
<div id="grafanaStats" class="grafana-stats"></div>
<div id="grafanaCharts" class="grafana-charts"></div></div>
</section>
<section id="rulesSection"><h2>Community 規則</h2>
<p id="ruleStatus" role="status">讀取規則…</p>
<div class="table-scroll"><table><thead><tr><th>規則</th><th>監控</th><th>條件</th><th>目前值／狀態</th><th>Prefix／Community</th><th>操作</th></tr></thead><tbody id="ruleRows"></tbody></table></div>
<details id="ruleEditor" open><summary id="ruleEditorTitle">新增規則</summary>
<form id="ruleForm"><input type="hidden" name="id">
<div class="fields"><label>名稱<input name="name" maxlength="96" required placeholder="例如：PPS 超標"></label><label>方向<select name="direction"><option>IN</option><option>OUT</option></select></label><label>監控目的網段<input name="destination" placeholder="例如 203.0.113.0/24" required></label></div>
<div class="fields"><label>協定<select name="protocol"><option value="any">全部</option><option value="tcp">TCP</option><option value="udp">UDP</option><option value="gre">GRE</option><option value="icmp">ICMP</option><option value="other">其他</option></select></label><label id="ruleFlagsLabel" hidden>TCP 組合<select name="tcp_flags" id="ruleFlags"><option value="">全部組合</option></select></label><label>平均包長（Bytes）<select name="mean_packet_size_bucket" id="rulePacketSize"><option value="">全部</option></select></label><label>單位<select name="metric"><option value="pps">pps</option><option value="bps">bps</option><option value="packets">包／視窗</option></select></label><label>觸發門檻 ≥<input name="threshold" type="number" min="0.000001" step="any" required placeholder="例如 100000"></label><label>復原門檻 ≤<input name="recovery_threshold" type="number" min="0" step="any" required placeholder="例如 50000"></label></div>
<div class="fields"><label>宣告 Prefix<input name="prefix" required placeholder="例如 203.0.113.1/32"></label><label>Next hop<input name="next_hop" required ></label></div>
<div class="community-editor"><label for="ruleCommunityInput">Community</label><div class="community-box"><div id="ruleCommunityCards" class="community-cards"></div><input id="ruleCommunityInput" placeholder="65000:666" aria-describedby="ruleCommunityError"></div><p id="ruleCommunityError" role="status"></p></div>
<details id="ruleAdvanced"><summary>進階設定（秒）</summary><div class="fields"><label>統計視窗<input name="window_seconds" type="number" min="1" max="60" value="1" required></label><label>持續超標<input name="hold_seconds" type="number" min="0" max="60" value="1" required></label><label>持續復原<input name="recovery_seconds" type="number" min="1" max="3600" value="10" required></label><label>撤回後冷卻<input name="cooldown_seconds" type="number" min="1" max="3600" value="30" required></label><label>到期撤回<input name="ttl" type="number" min="1" max="86400" value="300" required></label></div></details>
<label><input name="enabled" type="checkbox">儲存後啟用</label>
<button type="submit">儲存規則</button><button type="button" id="ruleNew">清空／新增</button>
</form></details>
<p id="ruleResult" role="status"></p>
</section>
<section><h2>GoBGP 狀態</h2><p id="bgpStatus">讀取中…</p><table><thead><tr><th>鄰居</th><th>ASN</th><th>連線狀態</th></tr></thead><tbody id="peers"></tbody></table></section>
<section><h2>路由控制</h2>
<form id="routeForm"><div class="fields"><label>目的網段<input name="prefix" placeholder="203.0.113.1/32" required></label><label>Next hop<input name="next_hop" placeholder="192.0.2.1" required></label><label>Community<input name="communities" placeholder="65000:666" required></label><label>到期撤回（秒）<input name="ttl" type="number" min="1" max="86400" value="300" required></label><label>備註<input name="note" maxlength="256" placeholder="處置原因"></label></div><button type="submit" id="announce" disabled>宣告路由</button></form>
<div class="table-scroll"><table><thead><tr><th>目的網段</th><th>Next hop</th><th>Community</th><th>模式</th><th>狀態</th><th>到期時間</th><th>備註／錯誤</th><th>操作</th></tr></thead><tbody id="routes"></tbody></table></div>
</section>
<section><h2>連線設定</h2><form id="settingsForm"><div class="fields"><label>GoBGP 位址<input name="endpoint" value="127.0.0.1:50051" required></label><label class="wide">允許操作網段<textarea name="allowed_prefixes" rows="2" placeholder="203.0.113.0/24"></textarea></label></div><button type="submit">儲存設定</button></form></section>
<section><h2>操作紀錄</h2><table><thead><tr><th>時間</th><th>操作</th><th>目的網段</th><th>模式</th><th>結果</th></tr></thead><tbody id="events"></tbody></table></section>
</body></html>
